[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.129.0",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "openpyxl",
    "pyjwt>=2.10.0",
]

[dependency-groups]
dev = [
    "selenium>=4.48.0",
    "webdriver-manager>=4.1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: red de seguridad de endpoints",
    "unit: pruebas puras de servicios y utilidades",
    "integration: pruebas de endpoints con base de datos",
    "e2e: flujos completos de negocio",
    "security: regresiones de autenticación, JWT y RBAC",
    "validation: longitudes, formatos y paginación",
    "regression: hallazgos corregidos en fases anteriores",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/alembic/*", "*/seed_data.py", "*/src/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic", "seed_data.py", "src/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E711",
    "E712",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["name-defined"]
exclude = "alembic/versions|src/tests|tests"
files = [
    "src/core/audit_context.py",
    "src/core/exceptions.py",
    "src/core/password.py",
    "src/core/security.py",
    "src/core/time.py",
    "src/modules/audit/service.py",
    "src/modules/sales/state.py",
]
