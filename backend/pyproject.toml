[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.129.0",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "openpyxl",
    "pyjwt>=2.10.0",
]

[dependency-groups]
dev = [
    "selenium>=4.48.0",
    "webdriver-manager>=4.1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: red de seguridad de endpoints",
]
