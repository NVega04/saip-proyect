services:
  db:
    image: mysql:8.0
    container_name: saip_db_container
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build: ./backend
    container_name: saip_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:Z
      - /app/.venv
    env_file:
      - .env
    environment:
      - UV_LINK_MODE=copy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app

  frontend:
    build: ./frontend
    container_name: saip_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src:Z
      - /src/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - app

volumes:
  mysql_data:

networks:
  app: