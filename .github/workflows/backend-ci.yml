name: Backend CI

on:
  push:
    branches: [master, main, "fase-*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: db_saip_ci
          MYSQL_ROOT_PASSWORD: saip_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psaip_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USER: root
      DB_PASSWORD: saip_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: db_saip_ci
      TEST_DB_NAME: db_saip_test
      JWT_SECRET: ci-jwt-secret-con-al-menos-32-caracteres
      # Claves Fernet de prueba (no secretos reales); la segunda prueba rotación.
      ENCRYPTION_KEY: >-
        smtkqsJHxX01CFiTpIHWcIZXrEpMvub2Mm1TIcdme-Y=,
        Nar9iorIwAUBeSVgqETB2ei86pd5a09hV2wl93FGAdk=
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      SQLALCHEMY_ECHO: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Type check
        working-directory: backend
        run: uv run mypy

      - name: Apply Alembic migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Alembic drift check
        working-directory: backend
        run: uv run alembic check

      - name: Tests with coverage
        working-directory: backend
        run: uv run pytest --cov=src --cov-report=term-missing:skip-covered
