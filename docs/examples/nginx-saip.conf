# Ejemplo de referencia: NO reemplaza la configuración real del servidor.
# Requiere certificados TLS emitidos previamente (p. ej. certbot).
# Si nginx corre en el mismo host que el backend, añadir a .env:
#   TRUSTED_PROXY_HOSTS=127.0.0.1,::1
# Si corre en otro host, añadir su IP en lugar de 127.0.0.1.

server {
    listen 80;
    server_name saip.lat www.saip.lat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saip.lat www.saip.lat;

    ssl_certificate     /etc/letsencrypt/live/saip.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saip.lat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS: solo activar cuando se haya verificado que HTTPS funciona.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
